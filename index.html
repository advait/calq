    <title>calq</title>
    <script>
      // Set the saved theme before first paint (settings.tsx keeps it in sync after).
      try {
        const theme =
          JSON.parse(localStorage.getItem("settings") || "{}").theme || "dark";
        const light =
          theme === "light" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        // Matches --surface for each theme in styles.css.
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", light ? "#f6f6f6" : "#25282b");
      } catch {}
    </script>
