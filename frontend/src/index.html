<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#25282b" />
    <meta name="description" content="calq is a calculator for humans." />
    <title>calq</title>
    <script>
      // Set the saved theme before first paint (settings.tsx keeps it in sync after).
      try {
        const theme =
          JSON.parse(localStorage.getItem("settings") || "{}").theme || "dark";
        const light =
          theme === "light" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        // Matches --surface for each theme in styles.css.
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", light ? "#f6f6f6" : "#25282b");
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="manifest" href="./assets/site.webmanifest" />
    <link rel="icon" href="./assets/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      href="./assets/favicon-16x16.png"
      sizes="16x16"
    />
    <link
      rel="icon"
      type="image/png"
      href="./assets/favicon-32x32.png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script src="./main.tsx" type="module"></script>
  </body>
</html>
